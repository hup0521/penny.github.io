<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集導覽</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #1d1d1f;
            --accent-color: #0071e3;
            --btn-bg: #ffffff;
            --btn-shadow: rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #f5f5f7;
                --accent-color: #0a84ff;
                --btn-bg: #1d1d1f;
                --btn-shadow: rgba(255, 255, 255, 0.05);
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 90%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 3rem;
            color: var(--text-color);
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .nav-item {
            position: relative;
            text-decoration: none;
            color: var(--text-color);
            background: var(--btn-bg);
            padding: 1.2rem;
            border-radius: 12px;
            font-size: 1rem;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px var(--btn-shadow);
            border: 1px solid rgba(128, 128, 128, 0.1);
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px var(--btn-shadow);
            border-color: var(--accent-color);
        }

        .nav-item::after {
            content: '→';
            font-size: 1.2rem;
            opacity: 0.3;
            transition: var(--transition);
        }

        .nav-item:hover::after {
            opacity: 1;
            transform: translateX(5px);
            color: var(--accent-color);
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            opacity: 0.4;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>我的專案</h1>
        
        <nav class="nav-list">
            <a href="Youbike.html" class="nav-item">
                Youbike 查詢
            </a>
            <a href="color%20flood.html" class="nav-item">
                Color Flood 遊戲
            </a>
            <a href="AI_Digital_Image_Workshop.html" class="nav-item">
                AI 數位影像工作坊
            </a>
        </nav>

        <div class="footer">
            &copy; 2024 Minimal Portfolio
        </div>
    </div>

    <script>
        // 簡單的點擊波紋效果或過場紀錄
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                // 可以在跳轉前加入平滑退場動畫
                console.log('正在導向至：', item.innerText.trim());
            });
        });

        // 偵測滑鼠進入容器的微互動
        const container = document.querySelector('.container');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
